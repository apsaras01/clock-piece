<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>とけいピース</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 配置: 1カラム。時計にピースを足し、12こで「ぷよっ」と1時間にまとまる。短針=青(時)・長針=赤(分)で色分け */
:root{
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif;
  --bg:#eef4fa; --card:#ffffff; --ink:#1b2a3a; --muted:#566779; --line:#d2dce7; --face:#ffffff;
  --accent:#2c64e3; --accent-ink:#ffffff; --a:#2c64e3; --b:#12805a; --mk-ink:#ffffff;
  --tick:#8696a8; --hour:#1f56d6; --minute:#d0392a; --ok:#12805a; --warn:#b4531a;
  --lap0:#ffc83d; --lap1:#37c3a3; --lap2:#ff7d6e; --lap3:#9585f2; --lap4:#4eaeff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101923; --card:#192634; --ink:#eaf1f8; --muted:#9fb1c3; --line:#2b3a4b; --face:#202f40;
    --accent:#6f9bff; --accent-ink:#0b1220; --a:#7ea6ff; --b:#4fd1a1; --mk-ink:#0b1220;
    --tick:#6f8196; --hour:#8fb0ff; --minute:#ff9a85; --ok:#4fd1a1; --warn:#ffb27a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101923; --card:#192634; --ink:#eaf1f8; --muted:#9fb1c3; --line:#2b3a4b; --face:#202f40;
  --accent:#6f9bff; --accent-ink:#0b1220; --a:#7ea6ff; --b:#4fd1a1; --mk-ink:#0b1220;
  --tick:#6f8196; --hour:#8fb0ff; --minute:#ff9a85; --ok:#4fd1a1; --warn:#ffb27a; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:17px; line-height:1.6;
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:560px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
.stars{font-weight:900;font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.stars i{font-style:normal;color:var(--lap0)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tab{font:700 15px/1.3 var(--font);min-height:56px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab small{display:block;font-weight:500;font-size:12px;opacity:.85}
.panel{display:grid;gap:14px;min-width:0}
.lead{margin:0;color:var(--muted);font-size:16px}
.lbl{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;min-width:0}
.clockbox{position:relative}
.cwrap{display:grid;place-items:center;padding-right:54px}
.hslot{width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);margin-top:16px}
.hplus.off{opacity:.4}
.cwrap svg{width:min(100%,380px);height:auto;display:block}
.hstack{position:absolute;right:6px;bottom:8px;display:grid;justify-items:center;gap:2px;pointer-events:none}
.hstack:empty{display:none}
.hplus{font-weight:900;font-size:22px;line-height:1;color:var(--hour)}
.hpile{display:flex;flex-direction:column-reverse;align-items:center;padding-top:16px}
.htok{width:40px;height:40px;margin-top:-16px}
.htok svg{width:40px;height:40px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.htok.new{animation:tokenPop .6s ease-out}
.hcap{font-size:12px;font-weight:900;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;font-size:14px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:24px;height:8px;border-radius:4px;margin-right:6px;vertical-align:middle}
.legend .h i{background:var(--hour);height:11px}
.legend .m i{background:var(--minute)}
.readout{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:center}
.tag{display:grid;justify-items:center;text-align:center;border-radius:12px;padding:4px 6px;font-weight:900;font-size:16px;line-height:1.25}
.tag small{font-size:11px;font-weight:700;color:var(--muted)}
.tag.dur{background:color-mix(in srgb,var(--lap0) 38%,var(--card))}
.tag.tm{background:color-mix(in srgb,var(--hour) 16%,var(--card))}
.rval .eq{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.rval .big{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.35}
.cap{margin:0;font-size:15px;font-weight:700;color:var(--hour)}
.note{min-height:1.6em;margin:0;text-align:center;font-weight:700;color:var(--ok)}
.note:empty{display:none}
.status{margin:0;text-align:center;font-weight:700}
.status:empty{display:none}
.shelf{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.shelf:empty{display:none}
.token{display:grid;justify-items:center;width:84px;font-size:13px;font-weight:700;color:var(--muted)}
.token svg{width:60px;height:60px}
.token.new{animation:tokenPop .6s ease-out}
@keyframes tokenPop{0%{transform:scale(.3);opacity:0}45%{transform:scale(1.25,.8);opacity:1}70%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.btn{font:700 18px/1.2 var(--font);min-height:54px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{font-size:15px;min-height:44px;color:var(--muted)}
.btn[aria-disabled="true"]{opacity:.45}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.step:focus-visible,.apb:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{word-break:keep-all;font:700 14px/1.3 var(--font);min-height:48px;padding:4px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.problem{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.problem svg{width:100%;max-width:132px;height:auto}
.problem .who{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.problem .who i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--mk-ink);font-size:16px;font-style:normal;margin-right:6px}
.who .ia{background:var(--a)} .who .ib{background:var(--b)}
.arrow{font-size:28px;font-weight:900;color:var(--muted)}
.question{margin:0;font-size:21px;font-weight:900;text-align:center;text-wrap:balance}
.bigq{margin:0;font-size:22px;font-weight:700;text-align:center;line-height:1.8}
.bigq b{font-weight:900;color:var(--hour);white-space:nowrap}
.rule{margin:0;text-align:center;font-weight:900;color:var(--muted);font-size:15px}
/* こたえいれ */
.answer{display:grid;gap:12px}
.ampm{display:flex;justify-content:center;gap:8px}
.apb{font:900 20px var(--font);min-height:52px;min-width:96px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.apb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steppers{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.stepper{display:flex;align-items:center;gap:6px}
.step{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:900 26px/1 var(--font);cursor:pointer}
.step.sm{width:46px;font-size:17px}
.val{min-width:76px;text-align:center;font-weight:700}
.val b{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;margin-right:2px}
.hint{background:color-mix(in srgb,var(--lap0) 22%,var(--card));border-radius:14px;padding:10px 14px;font-size:16px;font-weight:700}
.hint p{margin:0 0 4px}
.hint p:last-child{margin:0}
.result{margin:0;text-align:center;font-size:19px;font-weight:900;min-height:1.6em}
.result.ok{color:var(--ok)} .result.no{color:var(--warn)}
/* 分を時間に */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tile{display:grid;justify-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.tile svg{width:100%;max-width:52px;height:auto}
.tile.puyo{animation:tilePuyo .55s ease-in forwards}
@keyframes tilePuyo{0%{transform:scale(1)}30%{transform:scale(1.15,.85)}60%{transform:scale(.85,1.12)}100%{transform:scale(.15);opacity:0}}
.tiles-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-weight:700}
/* おはなし */
.story-text{margin:0;font-size:18px;line-height:1.95}
.memo ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.memo li{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:8px;font-weight:700}
.memo li b{color:var(--hour);font-variant-numeric:tabular-nums}
.q{display:grid;gap:12px}
.q.locked{opacity:.45}
.qtext{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:18px;font-weight:700;line-height:1.7}
.qn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ffc83d;color:#1b2a3a;font-weight:900;font-size:16px}
details.tryclock summary{cursor:pointer;font-weight:900;min-height:44px;display:flex;align-items:center}
details.tryclock[open] summary{margin-bottom:10px}
/* とけい(SVG) */
svg .face{fill:var(--face);stroke:var(--line);stroke-width:3}
svg .piece{stroke:var(--face);stroke-width:2;stroke-linejoin:round}
svg .lap0{fill:var(--lap0)} svg .lap1{fill:var(--lap1)} svg .lap2{fill:var(--lap2)} svg .lap3{fill:var(--lap3)} svg .lap4{fill:var(--lap4)}
svg .lapgroup{transform-box:fill-box;transform-origin:center}
svg .lapgroup .piece{transition:stroke-width .25s ease}
svg .lapgroup.merge .piece{stroke-width:0}
svg .lapgroup.wobble{animation:puyo .7s ease-out}
@keyframes puyo{0%{transform:scale(1)}16%{transform:scale(1.16,.84)}34%{transform:scale(.88,1.14)}52%{transform:scale(1.08,.94)}72%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
svg .tick{stroke:var(--tick);stroke-width:1.5}
svg .tick.big{stroke:var(--ink);stroke-width:3}
svg .hl{fill:var(--hour);fill-opacity:.2}
svg .num{font:700 24px var(--font);fill:var(--hour);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--face);stroke-width:4px;stroke-linejoin:round}
svg.mini .num{font-size:36px}
svg .mlabel{font:900 14px var(--font);fill:var(--minute);text-anchor:middle;dominant-baseline:central}
svg .hand-under{stroke:var(--face);stroke-linecap:round}
svg .hand-h{stroke:var(--hour);stroke-linecap:round}
svg .hand-m{stroke:var(--minute);stroke-linecap:round}
svg .dot-under{fill:var(--face)} svg .dot{fill:var(--ink)}
svg .mk.a{fill:var(--a)} svg .mk.b{fill:var(--b)}
svg .mk{stroke:var(--face);stroke-width:2}
svg .mkt{font:900 17px var(--font);fill:var(--mk-ink);text-anchor:middle;dominant-baseline:central}
svg .tface{fill:var(--face);stroke:var(--line);stroke-width:2}
svg .tpiece{fill:var(--lap0)}
@media (prefers-reduced-motion: reduce){
  .token.new,.htok.new,.tile.puyo,svg .lapgroup.wobble{animation:none}
  svg .lapgroup .piece{transition:none}
}
@media (max-width:420px){h1{font-size:23px}.tab{font-size:14px}.rrow{grid-template-columns:78px minmax(0,1fr)}}
</style>

<div class="app">
  <header class="top">
    <h1>とけいピース</h1>
    <div class="stars" aria-label="あつめた ほし"><i>★</i> <span id="starCount">0</span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="あそびかた">
    <button class="tab" role="tab" id="tab1" aria-selected="true" aria-controls="m1">ピースで あそぶ<small>5分ずつ ふやす</small></button>
    <button class="tab" role="tab" id="tab2" aria-selected="false" aria-controls="m2">A から B<small>時間の ながさ</small></button>
    <button class="tab" role="tab" id="tab3" aria-selected="false" aria-controls="m3">分を 時間に<small>まとめよう</small></button>
    <button class="tab" role="tab" id="tab4" aria-selected="false" aria-controls="m4">何時 何分？<small>時こくを もとめる</small></button>
    <button class="tab" role="tab" id="tab5" aria-selected="false" aria-controls="m5">おはなし<small>1日の ながれ</small></button>
  </nav>

  <label class="switch"><input type="checkbox" id="optLabels" checked> ながい はりの 「ぶんの かず」を みせる</label>

  <!-- 1 あそぶ -->
  <section class="panel" id="m1" role="tabpanel" aria-labelledby="tab1">
    <p class="lead">5分の ピースを 12こ あつめると、ながい はりが ちょうど 1しゅう。それが 1時間（60分）。1しゅうすると、みじかい はりは 数字を 1つ すすむよ。</p>
    <div id="clock1"></div>
  </section>

  <!-- 2 A から B -->
  <section class="panel" id="m2" role="tabpanel" aria-labelledby="tab2" hidden>
    <div class="seg" id="lv2" role="group" aria-label="むずかしさ">
      <button data-lv="1" aria-pressed="true">Lv1<br>じを またがない</button>
      <button data-lv="2" aria-pressed="false">Lv2<br>じを またぐ</button>
      <button data-lv="3" aria-pressed="false">Lv3<br>1時間より ながい</button>
    </div>
    <div class="card problem">
      <div><div id="miniA"></div><div class="who"><i class="ia">A</i><span id="txtA"></span></div></div>
      <div class="arrow" aria-hidden="true">→</div>
      <div><div id="miniB"></div><div class="who"><i class="ib">B</i><span id="txtB"></span></div></div>
    </div>
    <p class="question">A から B までは、なん時間 なん分？</p>
    <div id="clock2"></div>
    <div class="card" id="answerWrap2" hidden><div id="ans2"></div></div>
    <button class="btn quiet" id="new2">べつの もんだいに かえる</button>
  </section>

  <!-- 3 分を時間に -->
  <section class="panel" id="m3" role="tabpanel" aria-labelledby="tab3" hidden>
    <p class="question" id="q3"></p>
    <p class="rule">ピース 12こ ＝ 60分 ＝ 1時間</p>
    <div class="card"><div class="tiles" id="tiles3" aria-label="のこりの ピース"></div></div>
    <div class="ctrls"><button class="btn primary" id="merge3" style="grid-column:1/-1">12こを 1時間に まとめる</button></div>
    <p class="note" id="note3" aria-live="polite"></p>
    <div class="shelf" id="shelf3" aria-label="まとめた 1時間"></div>
    <div class="card"><div id="ans3"></div></div>
    <button class="btn quiet" id="new3">べつの もんだいに かえる</button>
  </section>

  <!-- 4 何時何分 -->
  <section class="panel" id="m4" role="tabpanel" aria-labelledby="tab4" hidden>
    <div class="seg" id="lv4" role="group" aria-label="むずかしさ">
      <button data-lv="1" aria-pressed="true">Lv1<br>じを またがない</button>
      <button data-lv="2" aria-pressed="false">Lv2<br>じを またぐ</button>
      <button data-lv="3" aria-pressed="false">Lv3<br>正午を またぐ</button>
    </div>
    <div class="card"><p class="bigq" id="q4"></p></div>
    <div id="clock4"></div>
    <div class="card"><div id="ans4"></div></div>
    <button class="btn quiet" id="new4">べつの もんだいに かえる</button>
  </section>

  <!-- 5 おはなし -->
  <section class="panel" id="m5" role="tabpanel" aria-labelledby="tab5" hidden>
    <div class="card"><p class="story-text" id="story5"></p></div>
    <div class="card memo"><p class="lbl">じこくメモ</p><ul id="memo5"></ul></div>
    <div class="panel" id="qs5"></div>
    <details class="card tryclock"><summary>とけいで ためす</summary><div id="clock5"></div></details>
    <button class="btn quiet" id="new5">べつの おはなしに かえる</button>
  </section>
</div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

  //PURE-START
  function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
  function pick(a){return a[rnd(0,a.length-1)]}
  function pad(n){return String(n).padStart(2,'0')}
  function nrm(t){return ((t%1440)+1440)%1440}
  function h12(t){t=nrm(t);return (Math.floor(t/60)%12)||12}
  function apOf(t){return nrm(t)<720?'午前':'午後'}
  function clockText(t){return h12(t)+':'+pad(nrm(t)%60)}
  function jaTm(t){var m=nrm(t)%60;return h12(t)+'時'+(m?m+'分':'')}
  function jaClock(t){var m=nrm(t)%60;return h12(t)+'時'+(m?m+'分':'ちょうど')}
  function jaFull(t){t=nrm(t);return t===720?'正午':apOf(t)+jaClock(t)}
  function durJa(d){var h=Math.floor(d/60),m=d%60;if(h===0)return m+'分';return h+'時間'+(m?m+'分':'')}
  function handCaption(t){
    var h=h12(t),m=nrm(t)%60,nx=h%12+1;
    if(m===0)return 'みじかい はり（時）は ちょうど '+h+' を さしているよ。';
    if(m===30)return 'みじかい はり（時）は '+h+' と '+nx+' の ちょうど まんなか。';
    return 'みじかい はり（時）は '+h+' と '+nx+' の あいだ。だから '+h+'時 すぎ。';
  }
  function genQ2(level){
    var Am,d;
    if(level===1){Am=5*rnd(0,9);d=5*rnd(2,(60-Am)/5)}
    else if(level===2){Am=5*rnd(3,11);d=5*rnd((60-Am)/5+1,11)}
    else{Am=5*rnd(0,11);d=60*rnd(1,3)+5*rnd(1,11)}
    var k=Math.floor((Am+d)/60);
    var Ah=rnd(1,Math.max(1,11-k));
    return {Ah:Ah,Am:Am,d:d};
  }
  function genQ4(level){
    var h,m,start,d,lo;
    if(level===1){
      h=pick([7,8,9,10,11,13,14,15,16,17,18]);m=5*rnd(0,9);start=h*60+m;d=5*rnd(2,(55-m)/5);
    }else if(level===2){
      h=pick([7,8,9,13,14,15,16,17]);m=5*rnd(1,11);start=h*60+m;
      lo=(60-m)/5+1;d=5*rnd(lo,lo+12);
    }else{
      h=rnd(10,11);m=5*rnd(0,11);start=h*60+m;
      lo=(720-start)/5+1;d=5*rnd(lo,lo+18);
    }
    return {start:start,d:d};
  }
  function stepsAdd(start,d){
    var P=Math.floor(d/60),Q=d%60,t=start,out=[];
    out.push('はじめは '+jaFull(t)+'。');
    if(P>0){t+=P*60;out.push(P+'時間 あとは '+jaFull(t)+'。（みじかい はりが '+P+'つ すすむよ）')}
    if(Q>0){

  /* ---- とけい(SVG) ---- */
  function pol(cx,cy,r,min){var a=min/60*2*Math.PI;return [cx+r*Math.sin(a),cy-r*Math.cos(a)]}
  function wedge(cx,cy,r,m0,m1){
    var p0=pol(cx,cy,r,m0),p1=pol(cx,cy,r,m1);
    return 'M'+cx+','+cy+' L'+p0[0].toFixed(2)+','+p0[1].toFixed(2)+' A'+r+','+r+' 0 0 1 '+p1[0].toFixed(2)+','+p1[1].toFixed(2)+' Z';
  }
  function clockSVG(o){
    var cx=160,cy=160,R=118,mini=!!o.mini,rn=mini?82:92,s='',i,n,p,q;
    s+='<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+(o.aria||'とけい')+'"'+(mini?' class="mini"':'')+'>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+4)+'" class="face"/>';
    if(o.pieces){
      s+='<g class="lapgroup'+(o.group?' '+o.group:'')+'">';
      for(i=0;i<o.pieces;i++){var m0=o.start+i*5;s+='<path d="'+wedge(cx,cy,R,m0,m0+5)+'" class="piece lap'+((o.lap||0)%5)+'"/>'}
      s+='</g>';
    }
    for(i=0;i<60;i++){
      var big=i%5===0;if(mini&&!big)continue;
      p=pol(cx,cy,R,i);q=pol(cx,cy,R-(big?12:6),i);
      s+='<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" class="tick'+(big?' big':'')+'"/>';
    }
    if(o.hl){for(i=0;i<o.hl.length;i++){p=pol(cx,cy,rn,o.hl[i]*5);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="18" class="hl"/>'}}
    for(n=1;n<=12;n++){
      p=pol(cx,cy,rn,n*5);
      s+='<text x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" class="num">'+n+'</text>';
    }
    if(o.labels&&!mini){
      for(n=1;n<=12;n++){
        p=pol(cx,cy,142,n*5);
        s+='<text x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" class="mlabel">'+((n*5)%60)+'</text>';
      }
    }
    (o.markers||[]).forEach(function(mk){
      var pt=pol(cx,cy,R,mk.pos);
      s+='<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="14" class="mk '+mk.cls+'"/>';
      s+='<text x="'+pt[0].toFixed(1)+'" y="'+pt[1].toFixed(1)+'" class="mkt">'+mk.text+'</text>';
    });
    if(o.time!=null){
      var hh=Math.floor(o.time/60)%12,mm=o.time%60;
      var hp=pol(cx,cy,62,(hh+mm/60)*5),mp=pol(cx,cy,104,mm);
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+hp[0].toFixed(1)+'" y2="'+hp[1].toFixed(1)+'" class="hand-under" stroke-width="15"/>';
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+mp[0].toFixed(1)+'" y2="'+mp[1].toFixed(1)+'" class="hand-under" stroke-width="11"/>';
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+hp[0].toFixed(1)+'" y2="'+hp[1].toFixed(1)+'" class="hand-h" stroke-width="9"/>';
      s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+mp[0].toFixed(1)+'" y2="'+mp[1].toFixed(1)+'" class="hand-m" stroke-width="5"/>';
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" class="dot-under"/><circle cx="'+cx+'" cy="'+cy+'" r="7" class="dot"/>';
    }
    return s+'</svg>';
  }
  function fullSVG(lap){
    var s='<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="20" cy="20" r="19" class="tface"/>',i;
    for(i=0;i<12;i++)s+='<path d="'+wedge(20,20,18,i*5,i*5+5)+'" class="piece lap'+(lap%5)+'" style="stroke-width:1"/>';
    return s+'</svg>';
  }
  function tileSVG(){
    return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="20" cy="20" r="19" class="tface"/><path d="'+wedge(20,20,18,0,5)+'" class="tpiece"/></svg>';
  }

  /* ---- ピースを ふやす とけい ---- */
  function PieceClock(root,o){
    var st={start:o.start||0,pieces:0,busy:false,locked:false,timers:[]};
    var max=o.max||60,btns=o.buttons||[1,3,6,12],R=o.readout||{},chips=o.chips||null;
    root.classList.add('panel');
    var html='';
    if(chips)html+='<div><p class="lbl">'+(o.chipLabel||'')+'</p><div class="seg chips"></div></div>';
    html+='<div class="card clockbox"><div class="cwrap"></div><div class="hstack"></div></div>';
    html+='<div class="legend"><span class="h"><i></i>みじかい はり ＝ 時</span><span class="m"><i></i>ながい はり ＝ 分</span></div>';
    if(R.dur||R.tm||R.cap){
      html+='<div class="card readout">';
      if(R.dur)html+='<div class="rrow"><span class="tag dur">時間<small>どれだけ</small></span><div class="rval"><div class="eq"></div><div class="big hmv"></div></div></div>';
      if(R.tm)html+='<div class="rrow"><span class="tag tm">時こく<small>いつ</small></span><div class="rval"><div class="big tmv"></div></div></div>';
      if(R.cap)html+='<p class="cap"></p>';
      html+='</div>';
    }
    html+='<p class="status" aria-live="polite"></p><p class="note" aria-live="polite"></p><div class="ctrls">';
    btns.forEach(function(n){html+='<button class="btn primary" data-n="'+n+'">＋'+(n===1?'5分':n===3?'15分':n===6?'30分':'1時間')+'</button>'});
    html+='<button class="btn" data-n="-1">もどす</button>';
    if(o.resetBtn)html+='<button class="btn quiet" data-reset="1">はじめから</button>';
    html+='</div>';
    root.innerHTML=html;
    var els={clock:$('.cwrap',root),eq:$('.eq',root),hm:$('.hmv',root),tm:$('.tmv',root),cap:$('.cap',root),
      status:$('.status',root),note:$('.note',root),stack:$('.hstack',root)};
    var api={st:st,
      setStatus:function(t,col){els.status.textContent=t;els.status.style.color=col||''}};

    function draw(part,lap,now,grp){
      var m=nrm(now)%60,hh=h12(now);
      els.clock.innerHTML=clockSVG({start:st.start%60,pieces:part,lap:lap,group:grp,labels:o.labels?o.labels():false,time:now,
        hl:R.cap?(m===0?[hh]:[hh,hh%12+1]):null,markers:o.markers?o.markers(st):[],aria:o.aria||'とけい'});
    }
    function drawShelf(laps,pop){
      if(!laps){els.stack.innerHTML='<div class="hslot"></div>';return}
      var h='<div class="hpile">';
      for(var i=0;i<laps;i++)h+='<div class="htok'+(i===pop?' new':'')+'">'+fullSVG(i)+'</div>';
      els.stack.innerHTML=h+'</div><span class="hcap">'+laps+'時間</span>';
    }
    function drawReadout(p){
      var t=p*5,now=st.start+t;
      if(R.dur){els.eq.innerHTML='5分 × <b>'+p+'</b>こ ＝ <b>'+t+'</b>分';els.hm.innerHTML='＝ <b>'+Math.floor(t/60)+'</b>時間 <b>'+(t%60)+'</b>分'}
      if(R.tm)els.tm.textContent=o.ampm?jaFull(now):jaTm(now);
      if(R.cap)els.cap.textContent=handCaption(now);
    }
    function noteFor(p){
      if(p===0)return o.zeroNote||'';
      if(p%12===0)return '12こで 60分 ＝ 1時間！ ながい はりが 1しゅう して、みじかい はりも 1つ すすんだよ。';
      if(p%12===6)return '6こで 30分。1時間の はんぶんだね。';
      return '';
    }
    function setBusy(b){$$('.ctrls .btn',root).forEach(function(x){x.setAttribute('aria-disabled',String(!!b))})}
    function final(pop){
      var p=st.pieces,laps=Math.floor(p/12);
      draw(p%12,laps,st.start+p*5,'');
      drawShelf(laps,pop?laps-1:-1);
      drawReadout(p);
      els.note.textContent=noteFor(p);
      if(o.onChange)o.onChange(st,api);
    }
    function clearTimers(){st.timers.forEach(clearTimeout);st.timers=[];st.busy=false;setBusy(false)}
    function add(n){
      if(st.busy||st.locked)return;
      var old=st.pieces,np=Math.max(0,Math.min(max,old+n));
      if(np===old)return;
      st.pieces=np;
      var oL=Math.floor(old/12),nL=Math.floor(np/12);
      if(np>old&&nL>oL&&!reduce){
        st.busy=true;setBusy(true);
        draw(12,oL,st.start+(oL+1)*60,'');
        drawReadout((oL+1)*12);
        els.note.textContent='12こ そろった！ ぷよっと まとまって、右下に 1時間が ふえるよ';
        var g=$('.lapgroup',els.clock);
        st.timers.push(setTimeout(function(){g.classList.add('merge')},60));
        st.timers.push(setTimeout(function(){g.classList.add('wobble')},320));
        st.timers.push(setTimeout(function(){st.busy=false;setBusy(false);final(true)},1050));
      }else final(nL>oL);
    }
    function renderChips(){
      if(!chips)return;
      $('.chips',root).innerHTML=chips.map(function(c){return '<button data-min="'+c.min+'" aria-pressed="'+(c.min===st.start)+'">'+c.label+'</button>'}).join('');
    }
    function setStart(min){clearTimers();st.start=min;st.pieces=0;renderChips();final(false)}
    api.setStart=setStart;
    api.setChips=function(arr){chips=arr;setStart(arr[0].min)};
    api.refresh=function(){if(!st.busy)final(false)};
    root.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.n)add(+b.dataset.n);
      else if(b.dataset.reset!==undefined)setStart(st.start);
      else if(b.closest('.chips')&&!st.locked)setStart(+b.dataset.min);
    });
    setStart(st.start);
    return api;
  }

  function AnswerPanel(root,cfg){
    var type=cfg.type,fine=!!cfg.fine,maxH=cfg.maxH||5,st,tries,solved,hints,hi,locked=false;
    var hl=type==='time'?'時':'時間';
    var mm=fine?'<button class="step sm" data-k="m" data-d="-5" aria-label="分を 5 へらす">−5</button><button class="step sm" data-k="m" data-d="-1" aria-label="分を 1 へらす">−1</button>':'<button class="step" data-k="m" data-d="-5" aria-label="分を へらす">−</button>';
    var mp=fine?'<button class="step sm" data-k="m" data-d="1" aria-label="分を 1 ふやす">＋1</button><button class="step sm" data-k="m" data-d="5" aria-label="分を 5 ふやす">＋5</button>':'<button class="step" data-k="m" data-d="5" aria-label="分を ふやす">＋</button>';
    root.innerHTML='<div class="answer">'+
      (type==='time'?'<div class="ampm" role="group" aria-label="午前か 午後か"><button class="apb" data-ap="午前" aria-pressed="true">午前</button><button class="apb" data-ap="午後" aria-pressed="false">午後</button></div>':'')+
      '<div class="steppers">'+
        '<div class="stepper"><button class="step" data-k="h" data-d="-1" aria-label="'+hl+'を へらす">−</button><div class="val"><b data-v="h">0</b>'+hl+'</div><button class="step" data-k="h" data-d="1" aria-label="'+hl+'を ふやす">＋</button></div>'+
        '<div class="stepper">'+mm+'<div class="val"><b data-v="m">0</b>分</div>'+mp+'</div>'+
      '</div>'+
      '<button class="btn primary" data-act="check">こたえあわせ</button>'+
      '<div class="hint" hidden></div><p class="result" aria-live="polite"></p>'+
      '<div class="ctrls"><button class="btn quiet" data-act="hint">ヒントを みる</button>'+(cfg.next===false?'':'<button class="btn primary" data-act="next" hidden>'+(cfg.nextLabel||'つぎの もんだい')+'</button>')+'</div></div>';
    var hintBox=$('.hint',root),res=$('.result',root),hintBtn=$('[data-act="hint"]',root),nextBtn=$('[data-act="next"]',root);
    function upd(){
      $('[data-v="h"]',root).textContent=st.h;$('[data-v="m"]',root).textContent=st.m;
      $$('.apb',root).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.ap===st.ap))});
    }
    function addHint(){
      if(hi>=hints.length)return false;
      var p=document.createElement('p');p.textContent=hints[hi++];hintBox.appendChild(p);hintBox.hidden=false;
      if(hi>=hints.length)hintBtn.hidden=true;else hintBtn.textContent='つぎの ヒント';
      return true;
    }
    function reset(h){
      st={h:type==='time'?1:0,m:0,ap:'午前'};tries=0;solved=false;hints=h||[];hi=0;
      hintBox.innerHTML='';hintBox.hidden=true;hintBtn.hidden=!hints.length;hintBtn.textContent='ヒントを みる';
      if(nextBtn)nextBtn.hidden=true;res.textContent='';res.className='result';upd();
    }
    function check(){
      if(solved)return;
      tries++;
      var r=cfg.judge({h:st.h,m:st.m,ap:st.ap,total:st.h*60+st.m});
      if(r.ok){
        solved=true;addStar();res.textContent='せいかい！ '+r.msg+' ★';res.className='result ok';
        while(addHint());
        hintBtn.hidden=true;if(nextBtn)nextBtn.hidden=false;
        if(cfg.onSolved)cfg.onSolved();
      }else{
        res.textContent=r.msg;res.className='result no';
        if(tries>=2)addHint();
      }
    }
    root.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b||locked)return;
      var k=b.dataset.k,act=b.dataset.act;
      if((k||b.dataset.ap)&&solved)return;
      if(k==='h'){var d=+b.dataset.d;st.h=type==='time'?((st.h-1+d+12)%12)+1:Math.max(0,Math.min(maxH,st.h+d))}
      else if(k==='m'){st.m=Math.max(0,Math.min(fine?59:55,st.m+(+b.dataset.d)))}
      else if(b.dataset.ap){st.ap=b.dataset.ap}
      else if(act==='check')check();
      else if(act==='hint')addHint();
      else if(act==='next'){if(cfg.onNext)cfg.onNext()}
      upd();
    });
    reset([]);
    return {reset:reset,lock:function(b){locked=b},isSolved:function(){return solved}};
  }
  function judgeDur(exp,generic){
    var eh=Math.floor(exp/60),em=exp%60;
    return function(v){
      if(v.total===exp)return {ok:true,msg:eh+'時間'+em+'分'};
      if(v.h===eh)return {ok:false,msg:'時間は あってるよ。分を もういちど かんがえよう'};
      if(v.m===em)return {ok:false,msg:'分は あってるよ。時間を みなおそう'};
      return {ok:false,msg:generic};
    };
  }
  function judgeTime(exp,generic){
    var ea=apOf(exp),eh=h12(exp),em=nrm(exp)%60;
    return function(v){
      var a=v.ap===ea,h=v.h===eh,m=v.m===em;
      if(a&&h&&m)return {ok:true,msg:jaFull(exp)};
      if(h&&m)return {ok:false,msg:'時こくは あってるよ！ 午前か 午後かを かくにんしよう'};
      if(a&&h)return {ok:false,msg:'時は あってるよ。ながい はり（分）を よみなおそう'};
      if(a&&m)return {ok:false,msg:'分は あってるよ。みじかい はり（時）を みなおそう'};
      return {ok:false,msg:generic};
    };
  }

      var A=s2.Ah*60+s2.Am,B=A+s2.d,target=s2.d/5,p=st.pieces,msg,col='';
      $('#miniA').innerHTML=clockSVG({mini:true,time:A,aria:'A '+clockText(A)});
      $('#miniB').innerHTML=clockSVG({mini:true,time:B,aria:'B '+clockText(B)});
      $('#txtA').textContent=clockText(A);$('#txtB').textContent=clockText(B);
      if(p===0)msg='ピースを ふやして、A から B まで すすもう';
      else if(p<target)msg='B は '+clockText(B)+' だよ。はりが B に つくまで すすめよう';
      else if(p===target){msg='B に ついた！ なん時間 なん分 かな？';col='var(--ok)'}
      else{msg='B を すぎちゃった。「もどす」で もどそう';col='var(--warn)'}
      api.setStatus(msg,col);
      $('#answerWrap2').hidden=!(p===target);
    }});
  clocks.push(clock2);
  var ans2=AnswerPanel($('#ans2'),{type:'dur',maxH:5,onNext:function(){newQ2()},
    judge:function(v){return judgeDur(s2.d,'もういちど。ピースを かぞえてみよう')(v)},
    onSolved:function(){clock2.st.locked=true}});
  function newQ2(){
    var g=genQ2(s2.level);s2.Ah=g.Ah;s2.Am=g.Am;s2.d=g.d;
    var p=g.d/5,h=Math.floor(p/12),r=p%12,hs=['A から B まで ピースは ぜんぶで '+p+'こ。'];
    if(r===0)hs.push('12こで 1時間。だから '+h+'時間 ちょうど。');
    else{hs.push('12こで 1時間。だから '+h+'時間 と ピース '+r+'こ。');hs.push(r+'こ × 5分 ＝ '+(r*5)+'分。')}
    hs.push('こたえは '+durJa(g.d)+'。');
    ans2.reset(hs);
    clock2.st.locked=false;
    clock2.setStart(s2.Ah*60+s2.Am);
  }
  levelButtons('#lv2',function(lv){s2.level=lv;newQ2()});
  $('#new2').addEventListener('click',newQ2);

  /* ===== 3. 分を 時間に ===== */
  var s3={n:90,tiles:18,clocks:0,busy:false};
  var ans3=AnswerPanel($('#ans3'),{type:'dur',maxH:5,onNext:function(){newQ3()},
    judge:function(v){var j=judgeDur(s3.n,'もういちど。まとめた 1時間を かぞえてみよう')(v);if(j.ok)j.msg=s3.n+'分 ＝ '+j.msg;return j},
    onSolved:function(){render3(false)}});
  function render3(pop){
    $('#q3').innerHTML='<b>'+s3.n+'分</b> は、なん時間 なん分？';
    var t='',i;
    for(i=0;i<s3.tiles;i++)t+='<div class="tile">'+tileSVG()+'<span>5分</span></div>';
    $('#tiles3').innerHTML=t||'<div class="tiles-empty">ピースは ぜんぶ まとめたよ</div>';
    var sh='';
    for(i=0;i<s3.clocks;i++)sh+='<div class="token'+((pop&&i===s3.clocks-1)?' new':'')+'">'+fullSVG(i)+'<span>1時間 (60分)</span></div>';
    $('#shelf3').innerHTML=sh;
    $('#merge3').setAttribute('aria-disabled',String(s3.tiles<12||ans3.isSolved()));
  }
  function newQ3(){
    s3.n=5*rnd(14,36);s3.tiles=s3.n/5;s3.clocks=0;s3.busy=false;
    var k=Math.floor(s3.n/60),rp=s3.tiles-12*k;
    var hs=[s3.tiles+'こ の ピースが あるよ。12こで 1時間 に まとめよう。','12こずつ まとめると '+k+'時間。'];
    hs.push(rp===0?'ピースは ぴったり ぜんぶ まとまる。':'のこりの ピースは '+rp+'こ。'+rp+'こ × 5分 ＝ '+(rp*5)+'分。');
    hs.push('こたえは '+durJa(s3.n)+'。');
    ans3.reset(hs);
    $('#note3').textContent='';
    render3(false);
  }
  $('#merge3').addEventListener('click',function(){
    if(s3.busy||ans3.isSolved())return;
    var note=$('#note3');
    if(s3.tiles<12){note.style.color='var(--warn)';note.textContent='ピースが 12こ ないと、1時間に ならないよ';return}
    s3.busy=true;
    $$('#tiles3 .tile').slice(0,12).forEach(function(t){t.classList.add('puyo')});
    note.style.color='';note.textContent='12こ ＝ 60分 ＝ 1時間！';
    setTimeout(function(){
      s3.tiles-=12;s3.clocks++;s3.busy=false;
      note.textContent='12こ ＝ 60分 ＝ 1時間！ いま '+s3.clocks+'時間';
      render3(true);
    },reduce?0:560);
  });
  $('#new3').addEventListener('click',newQ3);

  /* ===== 4. 何時 何分？ ===== */
  var s4={level:1,start:540,d:30};
  var clock4=PieceClock($('#clock4'),{
    start:540,max:60,labels:labelsOn,readout:{},ampm:true,aria:'はじめの じこくから すすめる とけい',
    markers:function(st){return [{pos:st.start%60,text:'A',cls:'a'}]}});
  clocks.push(clock4);
  var ans4=AnswerPanel($('#ans4'),{type:'time',onNext:function(){newQ4()},
    judge:function(v){return judgeTime(s4.start+s4.d,'もういちど。ピースで はりを うごかして よんでみよう')(v)}});
  function newQ4(){
    var g=genQ4(s4.level);s4.start=g.start;s4.d=g.d;
    $('#q4').innerHTML='<b>'+jaFull(g.start)+'</b> から <b>'+durJa(g.d)+'</b> あとの 時こくは、何時何分？';
    ans4.reset(['とけいの ピースを 5分ずつ ふやして、はりを うごかしてみよう。'].concat(stepsAdd(g.start,g.d)));
    clock4.st.locked=false;
    clock4.setStart(g.start);
  }
  levelButtons('#lv4',function(lv){s4.level=lv;newQ4()});
  $('#new4').addEventListener('click',newQ4);

  /* ===== 5. おはなし ===== */
  var s5=null,solvedUpTo=-1;
  var clock5=PieceClock($('#clock5'),{
    chips:[{label:'—',min:0}],chipLabel:'はじめの じこく',start:0,max:60,labels:labelsOn,
    readout:{dur:true,tm:true},ampm:true,resetBtn:true,aria:'ためしの とけい'});
  clocks.push(clock5);
  function renderMemo(){
    var rows=s5.rows.filter(function(r){return r.after<=solvedUpTo}).sort(function(a,b){return a.t-b.t});
    $('#memo5').innerHTML=rows.map(function(r){return '<li><b>'+jaFull(r.t)+'</b><span>'+r.label+'</span></li>'}).join('');
  }
  function newStory(){
    s5=genStory();solvedUpTo=-1;
    $('#story5').textContent=s5.text;
    renderMemo();
    var box=$('#qs5');box.innerHTML='';
    var cards=[];
    s5.qs.forEach(function(q,i){
      var card=document.createElement('div');card.className='card q';
      card.innerHTML='<p class="qtext"><span class="qn">'+(i+1)+'</span><span class="qt"></span></p><div class="mount"></div>';
      $('.qt',card).textContent=q.text;
      box.appendChild(card);
      var gen='もういちど。ヒントを みてもいいよ';
      var ap=AnswerPanel($('.mount',card),{type:q.type,fine:true,maxH:9,next:false,
        judge:q.type==='dur'?judgeDur(q.exp,gen):judgeTime(q.exp,gen),
        onSolved:function(){
          solvedUpTo=Math.max(solvedUpTo,i);renderMemo();
          if(cards[i+1]){cards[i+1].card.inert=false;cards[i+1].card.classList.remove('locked')}
        }});
      ap.reset(q.hints);
      cards.push({card:card,ap:ap});
    });
    cards.forEach(function(c,i){if(i>0){c.card.inert=true;c.card.classList.add('locked')}});
    clock5.setChips([{label:'ゲームを はじめた',min:s5.S},{label:'正午',min:720},{label:'家を 出た',min:s5.L}]);
  }
  $('#new5').addEventListener('click',newStory);

  newQ2();newQ3();newQ4();newStory();
})();
</script>

</body></html>
